project_id = "familyroots-ai"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:8081"
enable_signup = true
additional_redirect_urls = ["http://localhost:8081/verify-email", "http://localhost:8081/reset-password", "http://127.0.0.1:8081/verify-email", "http://127.0.0.1:8081/reset-password", "familyroots://verify-email", "familyroots://reset-password"]
minimum_password_length = 12

[auth.email]
enabled = true
enable_confirmations = true
max_frequency = "30s"
otp_length = 6
otp_expiry = 600

[auth.email.template.confirmation]
subject = "Verify your FamilyRoots AI email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your FamilyRoots AI password"
content_path = "./supabase/templates/recovery.html"

[functions.archive]
verify_jwt = false
